# Publishes @sfqa/scar to npm when you push a version tag, e.g. v0.1.0.
#
# No npm token is stored anywhere: npm "trusted publishing" lets this workflow
# prove its identity to npm over OIDC, and npm records a provenance attestation
# linking the published package to this repository and commit.
#
# One-time setup (see the README steps you were given):
#   1. The package must already exist on npm - publish 0.1.0 by hand once.
#   2. npmjs.com -> the package -> Settings -> Trusted Publisher -> GitHub Actions:
#      owner desardavaishali, repository sfqa-scar, workflow file release.yml.
#   3. Do NOT add an NPM_TOKEN / NODE_AUTH_TOKEN secret - it would override OIDC.
#
# Then a release is: bump the version, update CHANGELOG.md, commit, and
#   git tag v0.1.1 && git push origin v0.1.1

name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write # required for npm trusted publishing (OIDC)

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      # Trusted publishing needs npm 11.5.1 or newer.
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm run check
      - name: tag matches package version
        run: |
          version="v$(node -p "require('./packages/scar/package.json').version")"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match packages/scar/package.json ($version)"
            exit 1
          fi
      - name: publish
        working-directory: packages/scar
        run: npm publish --access public --provenance
